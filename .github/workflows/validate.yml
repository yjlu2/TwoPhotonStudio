name: Validate source and installation
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_install:
        description: "Run the complete Windows CPU install (downloads Cellpose-SAM)"
        type: boolean
        default: false
jobs:
  source:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q app scripts install.py
  install:
    if: github.event_name == 'workflow_dispatch' && inputs.full_install
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: ""
          auto-activate: true
      - name: Full CPU installation and model checks
        shell: bash -el {0}
        run: python install.py --device cpu
      - name: Synthetic pipeline regression
        shell: pwsh
        run: '& .\.local\envs\gui\python.exe scripts/smoke_pipeline.py .local/smoke'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: installation-report
          include-hidden-files: true
          path: |
            .local/doctor-report.json
            .local/core-installed.txt
            .local/models-installed.txt
            .local/smoke/checks.json

